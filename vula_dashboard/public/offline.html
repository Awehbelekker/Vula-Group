<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F5A45" />
  <title>Vula — offline</title>
  <!-- Shown by public/sw.js when a page can't be reached and this phone has no copy of the app yet.
       Self-contained: no scripts or styles from elsewhere (there's no signal to fetch them). -->
  <style>
    :root { --bg: #F7F4EE; --ink: #1D2420; --muted: #5C665F; --brand: #1F5A45; --on-brand: #FFFFFF; --card: #FFFFFF; --line: #E4DED3; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121614; --ink: #ECEFEA; --muted: #A9B2AC; --brand: #6FBF9A; --on-brand: #0E1A14; --card: #1B211E; --line: #2C3430; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 28px 24px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); }
    button { min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: var(--brand); color: var(--on-brand);
      font: 600 16px/1 inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="" />
    <h1>You’re offline</h1>
    <p>Vula needs signal to open. It will load as soon as your phone is back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
