# Retrieval eval cases (evals/retrieval.py). Did the knowledge base find the document that holds
# the answer, and did the fact reach the prompt?
#
#   tenant          a fixture-* tenant runs offline in CI (cases/retrieval_fixture.yaml); any other
#                   tenant runs live, read-only (Master › Benchmark, or `python -m evals.run
#                   retrieval --live`)
#   question        what the person typed
#   type            lookup | spec | price | policy | multi_hop | follow_up | sensitive | unanswerable
#   entry           owner (default: reasoning's retrieval) | customer (commerce_assistant's)
#   expected_docs   filename substrings, case-insensitive (live filenames vary by upload)
#   must_contain    text that must be in a retrieved chunk AND in the grounding block
#   forbidden_docs  filename substrings a customer must never get (type: sensitive)
#   language        en | af | mixed
#   synthetic       true when written from the document rather than taken from a real message
#
# Real failures first (seed: true), with the date and what went wrong. Public repository: no phone
# numbers, customers' names or tenants' figures.

cases:
