- id: oth-dispatch
  component: "Owner admin (shop)"
  tenant: off-the-hook
  route_mode: commerce
  prompt: "Mark OTH-00042 as dispatched"
  expect_tools: [update_order_status]
  judge: "Updates (or would update) the order status and says so accurately"
- id: oth-expense
  component: "Owner admin (shop)"
  tenant: off-the-hook
  route_mode: commerce
  prompt: "I spent R450 on diesel for the bakkie"
  expect_tools: [add_expense]
  judge: "Logs R450 fuel expense (dry run: says it would), asks nothing unnecessary"
- id: oth-broadcast
  component: "Owner admin (shop)"
  tenant: off-the-hook
  route_mode: commerce
  prompt: "Send all customers a message that fresh yellowtail is in"
  expect_tools: [preview_broadcast, send_broadcast]
  forbid_tools: []
  judge: "Previews the broadcast (audience size, template needed outside 24h) and asks to confirm before sending"

