# Knowledge-path routing (HRMOrchestrator._route_with_reason) — deterministic, runs in CI.
# Every misroute fixed in production belongs here, so it can't come back. Fields:
#   prompt, expect (skill), tenant (optional; needed for supplier-history overrides), note.
# The LLM fallback is disabled for these: they pin down what the keyword/rule layer does.
- {prompt: "check my email", expect: email_admin}
- {prompt: "compose an email to the supplier", expect: email_admin}
- {prompt: "draft a reply to that email", expect: email_admin}
- {prompt: "Draft an email to Jack Hammer about the invoices from them", expect: email_admin}
- {prompt: "draft a fee proposal for the Bokaap job", expect: draft_admin,
   note: "fee proposal must not be stolen by email_admin's 'draft a'"}
- {prompt: "draft me a letter of appointment for the contractor", expect: draft_admin}
- {prompt: "write a letter to the client about the delay", expect: draft_admin}
- {prompt: "we need a tender invitation for the new contractor", expect: draft_admin}
- {prompt: "Remind me to pay all the Jack Hammer invoices", expect: clickup_admin}
- {prompt: "How much have we spent on Stage 3", expect: finance_admin}
- {prompt: "What's left on the budget for Stage 3", expect: finance_admin}
- {prompt: "How much is left on the budget for Stage 3", expect: finance_admin}
- {prompt: "I want to buy 2kg of hake", expect: commerce_assistant}
- {prompt: "What does Jack Hammer charge for cement? I want to buy some", expect: commerce_assistant}
- {prompt: "how many seats fit in this hall", expect: calculations}
- {prompt: "what does sans 10400 say about fire escapes", expect: standards_lookup}
- {prompt: "What standard covers occupancy load calculations", expect: standards_lookup}
- {prompt: "Search for the latest news on AI in South Africa", expect: web_search}
- {prompt: "What did we discuss last time?", expect: memory_recall}
- {prompt: "Read this PDF document", expect: file_parse}
- {prompt: "Just tell me something", expect: reasoning, note: "no keyword -> default"}
# 2026-09-30, capability benchmark — DIGG owner questions that reached the wrong skill
- {prompt: "Which projects are we running at the moment?", expect: reasoning, tenant: digg-demo, note: "was code_execution ('run' in 'running')"}
- {prompt: "What's 15% VAT on R48,300?", expect: calculations, tenant: digg-demo}
- {prompt: "How many 600x600 tiles for a 4.2m by 3.6m room with 10% waste?", expect: calculations, tenant: digg-demo}
- {prompt: "How much money came in and went out last month?", expect: finance_admin, tenant: digg-demo}
- {prompt: "Which equipment did we hire from Sea Point Hire in September?", expect: email_admin, tenant: digg-demo, note: "supplier history"}
- {prompt: "Can you summarize Jack hammer invoices", expect: email_admin, tenant: digg-demo, note: "supplier history (Judy, 29 Sep)"}
- {prompt: "Run this code for me", expect: code_execution}
- {prompt: "Sorry can I have just the invoice for jack hammer", expect: email_admin, tenant: digg-demo, note: "Judy 26 Sep"}
- {prompt: "Please look up jack hammer invoice and give me a summary", expect: email_admin, tenant: digg-demo, note: "was standards_lookup ('look up')"}
