name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:

  # ── Python backend — lint for real errors only ───────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Catch real bugs only (undefined names, unused imports) in app code.
      # Excludes throwaway scripts/ and test fixtures. Style nits are ignored.
      - name: Lint app code
        run: ruff check vula/ core/ --select=F --exclude scripts,tests

      # Confirm the app imports cleanly (catches syntax/import errors that
      # would crash the server) without needing live Ollama/Qdrant.
      - name: Import check
        env:
          OLLAMA_BASE: http://localhost:11434
          QDRANT_BASE: http://localhost:6333
          API_KEY: "ci-test"
          DEBUG: "true"
        run: |
          pip install -r requirements.txt
          python -c "import vula.api.server; print('Server imports OK')"

  # ── React dashboard — build must pass ─────────────────────────────────────────
  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vula_dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
