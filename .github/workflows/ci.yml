name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:

  # ── Python backend — lint for real errors only ───────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Catch real bugs only (undefined names, unused imports) in app code.
      # Rule selection + excludes live in pyproject.toml [tool.ruff]; style nits are not linted.
      - name: Lint app code
        run: ruff check vula/ core/

      # Confirm the app imports cleanly (catches syntax/import errors that
      # would crash the server) without needing live Ollama/Qdrant.
      - name: Import check
        env:
          OLLAMA_BASE: http://localhost:11434
          QDRANT_BASE: http://localhost:6333
          API_KEY: "ci-test"
          DEBUG: "true"
        run: python -c "import vula.api.server; print('Server imports OK')"

      - name: Run tests
        env:
          OLLAMA_BASE: http://localhost:11434
          QDRANT_BASE: http://localhost:6333
          API_KEY: "ci-test"
          DEBUG: "true"
        run: pytest tests/

      # Every table created in migrations/*.sql must get RLS enabled somewhere —
      # regression guard for the security remediation pass (2026-07).
      - name: Check RLS coverage
        run: python tools/check_migrations_rls.py

      # Every new migration needs a startup_checks sentinel, so Master › Health (and the boot
      # schema check) can tell whether it was actually applied in the SQL editor.
      - name: Check migration sentinels
        run: python tools/check_migration_sentinels.py

      # Code under the dashboard / mobile / site folders ships to every browser or phone: no
      # secret may be written into it (2026-10-26: the mobile app carried the server API key).
      - name: Check client code for secrets
        run: python tools/check_client_secrets.py

      # Takeoff accuracy: every plan case that needs no model must measure within tolerance
      # (2% area, exact counts). Prints the error per plan type. evals/takeoff_bench.py.
      - name: Takeoff accuracy benchmark
        run: python -m evals.takeoff_bench

  # ── Docker image — the actual Railway build ───────────────────────────────────
  # Every deploy 2026-09-02 → 2026-09-10 failed silently at build (`COPY
  # requirements.txt` — wrong context) while GitHub CI stayed green, so prod ran
  # week-old code. This builds the exact image Railway builds, from the repo root.
  docker:
    name: Docker build (Railway image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f Dockerfile -t vula-mind:ci .

  # ── Fresh database — every migration replays and builds production's schema ───
  # Until 2026-11-03 nobody had replayed migrations/*.sql onto an empty database: it stopped at
  # 102, and production's schema had drifted from the files (see migrations/242). This builds a
  # local Supabase (infrastructure/local-supabase), applies every migration with the real runner,
  # and checks the tables and columns against migrations/production_schema.txt.
  fresh-database:
    name: Fresh database (migrations replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_mind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Start a local Supabase (database, auth, storage, API)
        working-directory: infrastructure/local-supabase
        run: supabase start -x imgproxy,vector,supavisor,postgres-meta
      - name: Apply every migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          VULA_ENV: staging
        run: |
          pip install "psycopg[binary]"
          python tools/migrate.py apply --target staging --yes
      - name: Schema matches production
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python tools/schema_fingerprint.py check migrations/production_schema.txt
      # Whole WhatsApp conversations against that database (tools/staging_flows.py): signed
      # webhooks in, a stand-in Meta on 127.0.0.1 records every reply. Crisis support, opt-out,
      # duplicate delivery and the takeoff flow. No AI model here: the flows don't need one.
      - name: WhatsApp flows on the fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          pip install -r requirements.txt
          python tools/staging_flows.py seed
          eval "$(supabase status --workdir ../infrastructure/local-supabase -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY)=' | sed 's/^API_URL=/export SUPABASE_URL=/; s/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_KEY=/')"
          export SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_KEY" VULA_ENV=staging API_KEY=ci-staging \
                 ENFORCE_TENANT_AUTH=true GRAPH_HOST=http://127.0.0.1:8799 \
                 VULA_FB_APP_SECRET=staging-flows-secret WHATSAPP_TOKEN=staging-token \
                 WHATSAPP_PHONE_ID=STAGINGPNID OLLAMA_BASE=http://127.0.0.1:9 QDRANT_BASE=http://127.0.0.1:6333
          uvicorn vula.api.server:app --port 7438 > /tmp/api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:7438/status && break; sleep 1; done
          python tools/staging_flows.py run --base-url http://127.0.0.1:7438 || { tail -80 /tmp/api.log; exit 1; }

  # ── React dashboard — build must pass ─────────────────────────────────────────
  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vula_dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The speed budget: what a phone downloads to open the app, and everything the installed
      # app keeps offline, gzipped (scripts/size-budget.json). Raise it only on purpose.
      - name: Speed budget
        run: npm run check:size

      # Every page on the shared design tokens: no new hardcoded colours or fonts (the
      # allowance per file only goes down — scripts/design-token-baseline.json).
      - name: Design tokens
        run: npm run check:tokens

      # Pure helpers the redesign leans on: tenant brand → contrast-safe tokens, and the one
      # money formatter (tests/unit, node:test — no extra framework).
      - name: Unit tests
        run: npm run test:unit
