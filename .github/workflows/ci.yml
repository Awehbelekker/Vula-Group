name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:

  # ── Python backend — lint for real errors only ───────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_mind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Catch real bugs only (undefined names, unused imports) in app code.
      # Rule selection + excludes live in pyproject.toml [tool.ruff]; style nits are not linted.
      - name: Lint app code
        run: ruff check vula/ core/

      # Confirm the app imports cleanly (catches syntax/import errors that
      # would crash the server) without needing live Ollama/Qdrant.
      - name: Import check
        env:
          OLLAMA_BASE: http://localhost:11434
          QDRANT_BASE: http://localhost:6333
          API_KEY: "ci-test"
          DEBUG: "true"
        run: python -c "import vula.api.server; print('Server imports OK')"

      - name: Run tests
        env:
          OLLAMA_BASE: http://localhost:11434
          QDRANT_BASE: http://localhost:6333
          API_KEY: "ci-test"
          DEBUG: "true"
        run: pytest tests/

      # Every table created in migrations/*.sql must get RLS enabled somewhere —
      # regression guard for the security remediation pass (2026-07).
      - name: Check RLS coverage
        run: python tools/check_migrations_rls.py

  # ── Docker image — the actual Railway build ───────────────────────────────────
  # Every deploy 2026-09-02 → 2026-09-10 failed silently at build (`COPY
  # requirements.txt` — wrong context) while GitHub CI stayed green, so prod ran
  # week-old code. This builds the exact image Railway builds, from the repo root.
  docker:
    name: Docker build (Railway image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f Dockerfile -t vula-mind:ci .

  # ── React dashboard — build must pass ─────────────────────────────────────────
  dashboard:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vula_dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vula_dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
