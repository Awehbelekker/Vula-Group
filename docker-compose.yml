version: "3.9"

# Vula Group — Full Stack
# Start everything: docker compose up -d
# Stop everything:  docker compose down

services:

  # ── Qdrant (vector store) ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: vula-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"     # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # ── Ollama (local inference) ───────────────────────────────────────────────
  # NOTE: GPU passthrough requires NVIDIA Container Toolkit on the host.
  # Without GPU, Ollama falls back to CPU (slower but functional).
  ollama:
    image: ollama/ollama:latest
    container_name: vula-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Vula API (Python backend) ──────────────────────────────────────────────
  vula-api:
    build:
      context: ./vula_mind
      dockerfile: Dockerfile
    container_name: vula-api
    restart: unless-stopped
    ports:
      - "7438:7438"
    env_file:
      - ./vula_mind/.env
    environment:
      OLLAMA_BASE: http://ollama:11434
      QDRANT_BASE: http://qdrant:6333
      DEBUG: "false"
    volumes:
      - vula_uploads:/tmp/vula_uploads
      - vula_takeoff:/tmp/vula_takeoff
      - vula_data:/root/.vula
    depends_on:
      - qdrant
      - ollama

  # ── Redis (task queue + caching) ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vula-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ── n8n (workflow automation) ──────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: vula-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: vula
      N8N_BASIC_AUTH_PASSWORD: vula2026
      GENERIC_TIMEZONE: Africa/Johannesburg
      WEBHOOK_URL: http://localhost:5678/
      # Allows n8n to call the Vula API on the host machine
      VULA_API_URL: http://host.docker.internal:7438
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── LiteLLM Gateway (unified model endpoint) ──────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: vula-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./infrastructure/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-vula-local-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama

  # ── Vula Dashboard (React) ─────────────────────────────────────────────────
  vula-dashboard:
    image: node:20-alpine
    container_name: vula-dashboard
    working_dir: /app
    command: sh -c "npm install && npm run build && npx serve dist -l 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./vula_dashboard:/app
    environment:
      VITE_API_URL: http://localhost:7438
    depends_on:
      - vula-api

volumes:
  qdrant_data:
  ollama_data:
  redis_data:
  n8n_data:
  vula_uploads:
  vula_takeoff:
  vula_data:
