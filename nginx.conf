# nginx.conf — Vula Group Production Reverse Proxy
#
# Usage (on a Linux VPS with Docker):
#   docker run -d -p 80:80 -p 443:443 \
#     -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v /etc/letsencrypt:/etc/letsencrypt:ro \
#     nginx:alpine
#
# To get SSL cert:
#   sudo certbot --nginx -d app.vula.ai

worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           SAMEORIGIN      always;
    add_header X-Content-Type-Options    nosniff         always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           strict-origin   always;
    add_header Permissions-Policy        "geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=onboard:10m rate=5r/m;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name app.vula.ai;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.vula.ai;

        ssl_certificate     /etc/letsencrypt/live/app.vula.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.vula.ai/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 55M;   # slightly above the 50MB file limit

        # ── Dashboard (static React build) ───────────────────────────────────
        root /var/www/vula-dashboard/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Static assets — long cache
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── API proxy ─────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://vula-api:7438/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_read_timeout  120s;   # allow time for LLM responses
            proxy_send_timeout  120s;
            proxy_connect_timeout 5s;
        }

        # Stricter rate limit on onboarding (prevents spam signups)
        location /api/v1/onboard {
            limit_req zone=onboard burst=3 nodelay;

            proxy_pass         http://vula-api:7438/v1/onboard;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Health check (no auth, no rate limit) ────────────────────────────
        location /api/status {
            proxy_pass       http://vula-api:7438/status;
            proxy_set_header Host $host;
        }
    }
}
